[tool.black]
line-length = 79
target-version = ["py313"]
extend-exclude = "migrations"

[tool.ruff]
line-length = 79
target-version = "py313"
exclude = ["migrations", ".venv"]

[tool.ruff.lint]
select = ["E", "F", "I"]

[tool.coverage.run]
source = ["app"]
omit = ["migrations/*"]

[tool.coverage.report]
show_missing = true
precision = 1
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "if __name__ == .__main__.:",
]
